name: CI/CD

# Lint and tests on every push to main/dev and on pull requests. Deployment is Vercel's: each client's project builds
# main (scripts/vercel-ignore-build.js), so nothing is deployed from here.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit + end-to-end tests with coverage (fails under 100% lines)
        run: >-
          node --no-warnings --test --experimental-test-coverage
          --test-coverage-include="src/**" --test-coverage-lines=100
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "test/**/*.test.js"
      - name: Concurrency (two instances approving at the same moment)
        if: matrix.node == 22
        run: npm run test:race
      - name: Upload coverage report
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  test-libsql:
    name: Tests (hosted libSQL database)
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get libsql-server (sqld), the server Turso runs
        run: |
          mkdir -p "$RUNNER_TEMP/sqld" && cd "$RUNNER_TEMP/sqld"
          npm pack @sqld/linux-x64@0.24.1-pre.42 --silent
          tar xzf sqld-linux-x64-*.tgz
          chmod +x package/sqld && package/sqld --version
          echo "SQLD_BIN=$RUNNER_TEMP/sqld/package/sqld" >> "$GITHUB_ENV"
      - name: All tests against a hosted-style database (each test file gets its own sqld)
        run: npm run test:libsql
      # Two server processes on one database (two "instances"), run on their own: in parallel with the rest they
      # starve the machine and make unrelated tests time out.
      - name: Concurrency (two instances approving at the same moment)
        run: npm run test:race
