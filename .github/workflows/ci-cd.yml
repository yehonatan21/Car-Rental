name: CI/CD

# dev  branch → lint + tests → image ghcr.io/<owner>/car-rental:dev    → deploy to "development"
# main branch → lint + tests → image ghcr.io/<owner>/car-rental:latest → deploy to "production"
# pull requests → lint + tests + image build (nothing is pushed or deployed)
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit + end-to-end tests with coverage (fails under 80% lines)
        run: >-
          node --no-warnings --test --experimental-test-coverage
          --test-coverage-include="src/**" --test-coverage-lines=80
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          "test/**/*.test.js"
      - name: Upload coverage report
        if: matrix.node == 22 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  test-libsql:
    name: Tests (hosted libSQL database)
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jerusalem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get libsql-server (sqld), the server Turso runs
        run: |
          mkdir -p "$RUNNER_TEMP/sqld" && cd "$RUNNER_TEMP/sqld"
          npm pack @sqld/linux-x64@0.24.1-pre.42 --silent
          tar xzf sqld-linux-x64-*.tgz
          chmod +x package/sqld && package/sqld --version
          echo "SQLD_BIN=$RUNNER_TEMP/sqld/package/sqld" >> "$GITHUB_ENV"
      - name: All tests against a hosted-style database (each test file gets its own sqld)
        run: npm run test:libsql

  docker:
    name: Docker images
    needs: [lint, test, test-libsql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 builds (e.g. Oracle Cloud free Ampere servers)
      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build development image (Dockerfile.dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: false
          tags: car-rental:dev-check
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build production image (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: car-rental:smoke
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Smoke test production image
        run: |
          docker run -d --name smoke -p 3000:3000 car-rental:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then echo; break; fi
            sleep 1
          done
          # Plain HTTP is redirected to HTTPS; requests forwarded as HTTPS by the proxy are served.
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/login)" = "301 https://localhost:3000/login"
          curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' http://localhost:3000/login
          curl -fsS -o /dev/null -H 'X-Forwarded-Proto: https' http://localhost:3000/static/style.css
          curl -fsS -D - -o /dev/null -H 'X-Forwarded-Proto: https' -H 'Host: car.example.org' http://localhost:3000/login | grep -i '^strict-transport-security'
          test "$(docker inspect -f '{{.Config.User}}' car-rental:smoke)" = "node"
          docker logs smoke
          docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Push production image (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod

  deploy-dev:
    name: Deploy → development
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.docker.outputs.image }}:dev
        run: .github/scripts/deploy.sh
      - name: Verify deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: .github/scripts/verify.sh

  deploy-prod:
    name: Deploy → production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    # Add "Required reviewers" to the production environment in GitHub to require a manual approval.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Trigger deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.docker.outputs.image }}:latest
        run: .github/scripts/deploy.sh
      - name: Verify deployment
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: .github/scripts/verify.sh
