# Every 10 minutes: the console runs the scheduled jobs of every client site (reminders before pickup and return,
# alerts about waiting requests, license checks, retrying e-mails that failed). Vercel's free plan runs its own cron
# only once a day, and the sites only run code while someone visits them, so this schedule is what makes reminders
# arrive on time.
#
# Needs, in the repository settings → Secrets and variables → Actions:
#   variable CONSOLE_URL            the console's address, e.g. https://car-rental-master-taupe.vercel.app
#   secret   CONSOLE_CRON_SECRET    the console's CRON_SECRET (the same value as in its Vercel project)
#
# GitHub may start a scheduled run a few minutes late, and turns schedules off in a repository with no activity
# for 60 days (re-enable it under Actions → Scheduled jobs). A failed run emails the repository owner.
name: Scheduled jobs

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the jobs of every site
        env:
          CONSOLE_URL: ${{ vars.CONSOLE_URL }}
          CRON_SECRET: ${{ secrets.CONSOLE_CRON_SECRET }}
        run: |
          if [ -z "$CONSOLE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CONSOLE_URL variable and the CONSOLE_CRON_SECRET secret (see the top of this file)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$CONSOLE_URL/internal/cron" | tee result.json
          echo
          # Every site must have answered; a site that didn't is named here and fails the run.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("result.json", "utf8"));
            const bad = (r.sites || []).filter((s) => !s.ok);
            for (const s of r.sites || []) console.log(`${s.ok ? "ok  " : "FAIL"} ${s.slug}${s.ok ? ` · reminders ${s.reminders} · mail sent ${s.mail_sent}, waiting ${s.mail_waiting}, failed ${s.mail_failed}` : ` · ${s.error}`}`);
            if (bad.length) { console.log(`::error::${bad.length} site(s) did not run their jobs: ${bad.map((s) => s.slug).join(", ")}`); process.exit(1); }
          '
