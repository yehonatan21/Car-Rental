# Production deployment (single host)
#   cp .env.example .env    # fill in BASE_URL and SMTP_* settings
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec app node scripts/create-admin.js --email ... --password ...
# Put a TLS-terminating reverse proxy (Caddy, Nginx, Traefik…) in front of port 3000.
services:
  app:
    image: ${IMAGE:-ghcr.io/yehonatan21/car-rental:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
